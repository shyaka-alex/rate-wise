# Nginx reverse proxy for Rate Wise on Web01 / Web02
# Place this file at: /etc/nginx/sites-available/rate-wise
# Then: sudo ln -s /etc/nginx/sites-available/rate-wise /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# Forwards public HTTP (port 80) to the Node.js app on localhost:3000.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Optional: raise body size if you later add uploads
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve / forward useful upstream headers
        proxy_pass_header X-Served-By;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health endpoint used by HAProxy checks
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass_header X-Served-By;
    }
}
