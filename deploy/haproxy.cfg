# HAProxy config for Rate Wise on Lb01
# Replace WEB01_IP and WEB02_IP with your actual server IPs before applying.
#
# Typical install path: /etc/haproxy/haproxy.cfg
# After editing: sudo haproxy -c -f /etc/haproxy/haproxy.cfg
#                sudo systemctl restart haproxy
#
# Test load balancing:
#   for i in 1 2 3 4 5 6; do curl -sI http://LB01_IP/health | grep -i x-served-by; done

global
    log /dev/log local0
    maxconn 2048
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  redispatch
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

frontend http_front
    bind *:80
    default_backend ratewise_backends

backend ratewise_backends
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    # Replace placeholders with real Web01 / Web02 IP addresses
    server web01 WEB01_IP:80 check inter 5s fall 3 rise 2
    server web02 WEB02_IP:80 check inter 5s fall 3 rise 2
